[package]
name = "rusty_fish"
version = "0.2.3"
edition = "2021"

[lib]
name = "rusty_fish"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
libc = "0.2.189"
tracing = "0.1.44"
tracing-android = "0.2.0"
tracing-subscriber = "0.3.23"


[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
